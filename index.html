<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apache HTTPD Docker App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>🚀 Hello from Apache HTTPD in Docker!</h1>
        <p>This page is served by Apache httpd running inside a Docker container.</p>
        <button id="clickMe">Click me</button>
        <p id="message"></p>
        <footer>
            <p>Served by: <span id="server-info"></span></p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
